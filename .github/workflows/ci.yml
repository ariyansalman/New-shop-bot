name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest tests/ -v

  migrations-postgres:
    name: Alembic migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: shopbot
          POSTGRES_DB: shopbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic/env.py only needs DATABASE_URL - BOT_TOKEN/ADMIN_TELEGRAM_ID
      # are read by config/settings.py at import time but only checked for
      # truthiness by validate_settings(), which this job never calls.
      #
      # sslmode=disable: config/settings.py's _normalize_database_url()
      # defaults every postgresql:// URL to sslmode=require (Supabase
      # rejects unencrypted connections) via query.setdefault(), which only
      # fills in a value that's absent - passing sslmode=disable here
      # overrides that default rather than being clobbered by it. This
      # plain postgres:16 service container doesn't speak TLS at all, so
      # without this override every connection attempt fails with
      # "server does not support SSL, but SSL was required" (confirmed by
      # actually running this job before adding the override).
      DATABASE_URL: postgresql://shopbot:shopbot@localhost:5432/shopbot?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: alembic upgrade head (fresh database)
        run: alembic upgrade head

      - name: alembic downgrade to base and back up
        # Catches a migration whose downgrade() doesn't actually undo its
        # upgrade() - SQLite's batch-mode table rebuilds tend to hide this,
        # Postgres's plain ALTER TABLE does not.
        run: |
          alembic downgrade base
          alembic upgrade head

  docker-build:
    name: Docker build + boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t shopbot:ci .

      - name: Boot smoke test
        # A real BOT_TOKEN isn't available in CI, so this can't prove the
        # bot successfully starts polling - but the container reaching (and
        # logging) "Database initialization complete" proves the image
        # actually has every dependency, that app.py's config validation +
        # SQLite init run cleanly inside it, and that CMD is wired up
        # correctly. It fails a few seconds later on the fake token
        # against the real Telegram API, which is the expected/correct
        # failure mode for this test, not a problem it needs to survive.
        run: |
          CID=$(docker run -d \
            -e BOT_TOKEN="000000:invalid-token-for-ci-smoke-test" \
            -e ADMIN_TELEGRAM_ID="1" \
            -e DATABASE_URL="sqlite:////tmp/ci_smoke.db" \
            -e WEBHOOK_ENABLED="false" \
            shopbot:ci)
          sleep 8
          echo "--- container logs ---"
          docker logs "$CID"
          docker logs "$CID" 2>&1 | grep -q "Database initialization complete" \
            || { echo "##[error]Container did not reach DB init - see logs above"; exit 1; }
          docker stop "$CID" >/dev/null
          docker rm "$CID" >/dev/null
