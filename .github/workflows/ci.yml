name: CI

on:
  push:
    branches: ["main", "claude/static-audit-t15f7x"]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest tests/ -v

  migrations-postgres:
    name: Alembic migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: shopbot
          POSTGRES_DB: shopbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic/env.py only needs DATABASE_URL - BOT_TOKEN/ADMIN_TELEGRAM_ID
      # are read by config/settings.py at import time but only checked for
      # truthiness by validate_settings(), which this job never calls.
      DATABASE_URL: postgresql://shopbot:shopbot@localhost:5432/shopbot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: alembic upgrade head (fresh database)
        run: alembic upgrade head

      - name: alembic downgrade to base and back up
        # Catches a migration whose downgrade() doesn't actually undo its
        # upgrade() - SQLite's batch-mode table rebuilds tend to hide this,
        # Postgres's plain ALTER TABLE does not.
        run: |
          alembic downgrade base
          alembic upgrade head
